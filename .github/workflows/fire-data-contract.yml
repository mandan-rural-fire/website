# Daily contract check on the external data the site depends on: the ND DES
# county fire layer (rating + burn declaration), the state's daily fire
# danger PNG, and the NWS alerts endpoint. The site fails soft when these
# change shape; this workflow makes the change loud, GitHub emails the repo
# owner when a run fails. See tools/check-fire-data.mjs for the assertions.
name: fire-data-contract

on:
  schedule:
    # 13:30 UTC = 7:30/8:30 AM Central, after the state's ~6 AM daily update.
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-fire-data.mjs
